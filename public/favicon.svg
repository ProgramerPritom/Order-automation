<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#4338CA" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Accent Electric Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Golden AI Spark Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Outer Soft Glow -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur" />
    </filter>
  </defs>

  <!-- Ambient Glow Behind Icon -->
  <rect x="56" y="56" width="400" height="400" rx="100" fill="#6366F1" opacity="0.35" filter="url(#softGlow)" />

  <!-- Squircle Base Frame -->
  <rect x="36" y="36" width="440" height="440" rx="110" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="6" />

  <!-- Subtle Inner Lighting Ring -->
  <rect x="46" y="46" width="420" height="420" rx="100" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="3" />

  <!-- Modern Shopping Bag / Automation Node Silhouette -->
  <!-- Handle -->
  <path d="M196 200 C 196 145, 316 145, 316 200" fill="none" stroke="url(#cyanGrad)" stroke-width="26" stroke-linecap="round" />

  <!-- Bag Body with Sleek Rounded Corners -->
  <path d="M136 210 
           C 136 195, 150 185, 166 185 
           L 346 185 
           C 362 185, 376 195, 376 210 
           L 396 370 
           C 400 395, 380 415, 355 415 
           L 157 415 
           C 132 415, 112 395, 116 370 
           Z" 
        fill="rgba(255, 255, 255, 0.07)" 
        stroke="rgba(255, 255, 255, 0.3)" 
        stroke-width="10" />

  <!-- Automation Data Lines / Circuit -->
  <line x1="160" y1="280" x2="205" y2="280" stroke="#818CF8" stroke-width="10" stroke-linecap="round" opacity="0.8" />
  <line x1="160" y1="320" x2="220" y2="320" stroke="#818CF8" stroke-width="10" stroke-linecap="round" opacity="0.8" />
  <line x1="160" y1="360" x2="190" y2="360" stroke="#818CF8" stroke-width="10" stroke-linecap="round" opacity="0.8" />

  <!-- AI Automation Sparkle (4-point Dynamic Star) -->
  <g filter="url(#glow)">
    <path d="M 305 230 
             Q 305 295, 370 295 
             Q 305 295, 305 360 
             Q 305 295, 240 295 
             Q 305 295, 305 230 Z" 
          fill="url(#goldGrad)" />
  </g>

  <!-- Small Satellite Sparkle (Top-Right of Bag) -->
  <g filter="url(#glow)">
    <path d="M 390 120 
             Q 390 145, 415 145 
             Q 390 145, 390 170 
             Q 390 145, 365 145 
             Q 390 145, 390 120 Z" 
          fill="#38BDF8" />
  </g>

  <!-- Active Status Indicator Dot (Green Live Dot) -->
  <circle cx="125" cy="130" r="22" fill="#10B981" stroke="#1E1B4B" stroke-width="8" filter="url(#glow)" />
</svg>
